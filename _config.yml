# Site settings
title: Carlos Mora
description: >-
  Senior Platform Engineer specializing in platform architecture,
  data platform governance, and compliance automation for regulated multi-cloud environments.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://carlosmora.dev"

# Author settings
author:
  name: Carlos Mora
  email: hi@carlosmora.dev
  github: carlosmoradev
  linkedin: carlosmoradev
  twitter: carlosmoradev

# Social links for jekyll-seo-tag
social:
  name: Carlos Mora
  links:
    - https://github.com/carlosmoradev
    - https://linkedin.com/in/carlosmoradev

# Default social sharing image
logo: /assets/images/social-card.png

# Build settings
theme: minima # GitHub Pages compatible theme
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Collections for projects
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - CLAUDE.md
  - .mindblowing
  - .claude
  - "*.deb"
